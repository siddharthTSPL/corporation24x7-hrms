<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-R8CB0X9Y5Q"
    ></script>

    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);
      }

      gtag('js', new Date());
      gtag('config', 'G-R8CB0X9Y5Q');
    </script>

    <!--
      Per-page tags (title, description, canonical, og:title/description/url/image,
      twitter:title/description/image, robots) are NOT written here on purpose.
      - In the browser they come from <RouteSeo /> (src/components/RouteSeo.jsx).
      - In the built site, scripts/seo-build.mjs writes them into each page's HTML.
      Putting them here too would create duplicate / conflicting tags.
    -->
    <title>TorchX Talent — HRMS Software</title>

    <meta name="author" content="TechTorch Solutions Private Limited" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Site-wide Open Graph / Twitter defaults -->
    <meta property="og:site_name" content="TorchX Suite" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Favicons -->
    <link rel="icon" href="/talent/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/talent/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/talent/favicon-192.png" />
    <link rel="apple-touch-icon" href="/talent/apple-touch-icon.png" />
    

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google Fonts: non-blocking (media=print swap), variable-weight ranges => fewer requests -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400..900&family=DM+Sans:ital,opsz,wght@0,9..40,300..600;1,9..40,400&family=Instrument+Sans:wght@400..700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400..900&family=DM+Sans:ital,opsz,wght@0,9..40,300..600;1,9..40,400&family=Instrument+Sans:wght@400..700&display=swap"
      />
    </noscript>
    <link rel="dns-prefetch" href="https://api.torchxsuite.com" />

    <!-- Structured data: Organization + product (site-wide) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://torchxsuite.com/#org",
            "name": "TechTorch Solutions Private Limited",
            "url": "https://torchxsuite.com",
            "logo": "https://torchxsuite.com/talent/og-image.png"
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://torchxsuite.com/talent/#app",
            "name": "TorchX Talent",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "url": "https://torchxsuite.com/talent/",
            "description": "TorchX Talent is an HRMS platform for employee management, attendance, leave, timesheets, payroll and recruitment.",
            "publisher": { "@id": "https://torchxsuite.com/#org" }
          }
        ]
      }
    </script>

    <!-- Global Styles -->
    <style>
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #ffffff;
        color: #111827;
      }
      #root { min-height: 100vh; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
